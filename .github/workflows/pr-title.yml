name: PR title

# Squash-merge uses the PR title as the commit message, so enforcing Conventional
# Commits here keeps main's history clean and drives automatic versioning.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            api
            web
            admin
            mobile
            db
            deps
            ci
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'Start the subject with a lowercase letter, e.g. "feat(api): add event reminders".'
