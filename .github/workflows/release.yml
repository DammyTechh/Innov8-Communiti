name: Release

# Reads Conventional Commits on main and keeps a "release" PR open that bumps the
# version and updates CHANGELOG.md. Merging that PR tags the release (api-vX.Y.Z)
# and the next production deploy reports the new version in /health.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
